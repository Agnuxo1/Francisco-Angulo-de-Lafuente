name: Publish profile release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Build reproducible source archives
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="francisco-angulo-de-lafuente-${version}/" "$TAG" -o "dist/francisco-angulo-de-lafuente-${version}.tar.gz"
          git archive --format=zip --prefix="francisco-angulo-de-lafuente-${version}/" "$TAG" -o "dist/francisco-angulo-de-lafuente-${version}.zip"
          (cd dist && sha256sum francisco-angulo-de-lafuente-*) > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Francisco Angulo de Lafuente ${TAG}" \
            --generate-notes
